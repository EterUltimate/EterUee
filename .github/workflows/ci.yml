name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '26'
  DESKTOP_JAVA_VERSION: '24'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.28.2'
  TERMUX_APP_COMMIT: '30ebb2dee381d292ade0f2868cfde0f9f20b89fe'
  HIDDIFY_CORE_VERSION: 'v4.1.0'
  HIDDIFY_CORE_ANDROID_SHA256: '6c4841f7aab23eb1fb17831349ecdfc3ca9c31553b8cbe5effd820cb12607f56'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  web-ui:
    name: WebUI Type, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install WebUI dependencies
        run: pnpm -C web-ui install --frozen-lockfile

      - name: Lint WebUI
        run: pnpm -C web-ui exec oxlint app --deny-warnings

      - name: Typecheck WebUI
        run: pnpm -C web-ui typecheck

      - name: Build WebUI
        run: pnpm -C web-ui build

  shared-kmp:
    name: Shared KMP Apple Framework
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare Termux Android modules
        run: |
          git clone https://github.com/termux/termux-app.git ../termux-app
          git -C ../termux-app checkout "$TERMUX_APP_COMMIT"
          perl -0pi -e 's/proguard-android\.txt/proguard-android-optimize.txt/g' \
            ../termux-app/terminal-emulator/build.gradle \
            ../termux-app/terminal-view/build.gradle

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build shared metadata and Android host tests
        run: ./gradlew :shared:metadataCommonMainClasses :shared:compileAndroidMain :shared:testAndroidHostTest --no-daemon --stacktrace

      - name: Build Apple XCFramework
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :shared:assembleEterUeeSharedDebugXCFramework --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep_seconds=$((attempt * 20))
            echo "Apple XCFramework build failed; retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Prepare Swift package framework
        run: |
          rm -rf apple/Frameworks/EterUeeShared.xcframework
          mkdir -p apple/Frameworks
          cp -R shared/build/XCFrameworks/debug/EterUeeShared.xcframework apple/Frameworks/

      - name: Test Swift macOS host
        run: swift test --package-path apple

      - name: Build Swift iOS simulator host
        working-directory: apple
        run: |
          SCHEMES="$(xcodebuild -list | awk '/Schemes:/{p=1;next} p && NF {sub(/^[[:space:]]*/, ""); sub(/[[:space:]]*$/, ""); print}')"
          PACKAGE_SCHEME="$(printf '%s\n' "$SCHEMES" | grep -- '-Package$' | head -n 1 || true)"
          if [ -z "$PACKAGE_SCHEME" ]; then
            PACKAGE_SCHEME="$(printf '%s\n' "$SCHEMES" | head -n 1)"
          fi
          test -n "$PACKAGE_SCHEME"
          echo "Using Swift package scheme: $PACKAGE_SCHEME"
          xcodebuild \
            -scheme "$PACKAGE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath .build/xcode-derived \
            build

      - name: Upload Apple XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: EterUeeShared-debug-xcframework
          path: shared/build/XCFrameworks/debug/EterUeeShared.xcframework
          if-no-files-found: error
          retention-days: 7

  shared-kmp-windows:
    name: Shared KMP Windows Native
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare Termux Android modules
        shell: pwsh
        run: |
          git clone https://github.com/termux/termux-app.git ../termux-app
          git -C ../termux-app checkout $env:TERMUX_APP_COMMIT
          (Get-Content ../termux-app/terminal-emulator/build.gradle) `
            -replace 'proguard-android\.txt', 'proguard-android-optimize.txt' |
            Set-Content ../termux-app/terminal-emulator/build.gradle
          (Get-Content ../termux-app/terminal-view/build.gradle) `
            -replace 'proguard-android\.txt', 'proguard-android-optimize.txt' |
            Set-Content ../termux-app/terminal-view/build.gradle

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build shared metadata and Windows target
        run: .\gradlew.bat :shared:metadataCommonMainClasses :shared:compileKotlinMingwX64 --no-daemon --stacktrace --console=plain

      - name: Run Windows native smoke executable
        run: .\gradlew.bat :shared:runDebugExecutableMingwX64 --no-daemon --stacktrace --console=plain

      - name: Run Windows native tests
        run: .\gradlew.bat :shared:mingwX64Test --no-daemon --stacktrace --console=plain

      - name: Upload Windows native executable
        uses: actions/upload-artifact@v7
        with:
          name: EterUeeShared-windows-mingwX64-debug
          path: shared/build/bin/mingwX64/debugExecutable/*.exe
          if-no-files-found: error
          retention-days: 7

  shared-kmp-linux:
    name: Shared KMP Linux Native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare Termux Android modules
        run: |
          git clone https://github.com/termux/termux-app.git ../termux-app
          git -C ../termux-app checkout "$TERMUX_APP_COMMIT"
          perl -0pi -e 's/proguard-android\.txt/proguard-android-optimize.txt/g' \
            ../termux-app/terminal-emulator/build.gradle \
            ../termux-app/terminal-view/build.gradle

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build shared metadata and Linux target
        run: ./gradlew :shared:metadataCommonMainClasses :shared:compileKotlinLinuxX64 --no-daemon --stacktrace --console=plain

      - name: Run Linux native smoke executable
        run: ./gradlew :shared:runDebugExecutableLinuxX64 --no-daemon --stacktrace --console=plain

      - name: Run Linux native tests
        run: ./gradlew :shared:linuxX64Test --no-daemon --stacktrace --console=plain

      - name: Upload Linux native executable
        uses: actions/upload-artifact@v7
        with:
          name: EterUeeShared-linux-linuxX64-debug
          path: shared/build/bin/linuxX64/debugExecutable/*
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Desktop Windows EXE
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare Termux Android modules
        shell: pwsh
        run: |
          git clone https://github.com/termux/termux-app.git ../termux-app
          git -C ../termux-app checkout $env:TERMUX_APP_COMMIT
          (Get-Content ../termux-app/terminal-emulator/build.gradle) `
            -replace 'proguard-android\.txt', 'proguard-android-optimize.txt' |
            Set-Content ../termux-app/terminal-emulator/build.gradle
          (Get-Content ../termux-app/terminal-view/build.gradle) `
            -replace 'proguard-android\.txt', 'proguard-android-optimize.txt' |
            Set-Content ../termux-app/terminal-view/build.gradle

      - name: Set up JDK 24 for desktop packaging
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: ${{ env.DESKTOP_JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Use setup-java runtime for desktop packaging
        shell: pwsh
        run: |
          if (Test-Path gradle/gradle-daemon-jvm.properties) {
            Move-Item gradle/gradle-daemon-jvm.properties gradle/gradle-daemon-jvm.properties.ci-backup
          }

      - name: Build and verify Windows desktop package
        run: .\gradlew.bat :desktop:desktopReleasePackage --no-daemon --stacktrace --console=plain

      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-exe
          path: |
            desktop/build/compose/binaries/main-release/exe/*.exe
            desktop/build/compose/binaries/main-release/desktop-release-manifest.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows packaging logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-exe-logs
          path: desktop/build/compose/logs/**
          if-no-files-found: ignore
          retention-days: 7

  desktop-linux:
    name: Desktop Linux DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare Termux Android modules
        run: |
          git clone https://github.com/termux/termux-app.git ../termux-app
          git -C ../termux-app checkout "$TERMUX_APP_COMMIT"
          perl -0pi -e 's/proguard-android\.txt/proguard-android-optimize.txt/g' \
            ../termux-app/terminal-emulator/build.gradle \
            ../termux-app/terminal-view/build.gradle

      - name: Set up JDK 24 for desktop packaging
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: ${{ env.DESKTOP_JAVA_VERSION }}

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Use setup-java runtime for desktop packaging
        run: |
          if [ -f gradle/gradle-daemon-jvm.properties ]; then
            mv gradle/gradle-daemon-jvm.properties gradle/gradle-daemon-jvm.properties.ci-backup
          fi

      - name: Build and verify Linux desktop package
        run: ./gradlew :desktop:desktopReleasePackage --no-daemon --stacktrace --console=plain

      - name: Upload Linux desktop package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-deb
          path: |
            desktop/build/compose/binaries/main-release/deb/*.deb
            desktop/build/compose/binaries/main-release/desktop-release-manifest.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux packaging logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-deb-logs
          path: desktop/build/compose/logs/**
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare Termux Android modules
        run: |
          git clone https://github.com/termux/termux-app.git ../termux-app
          git -C ../termux-app checkout "$TERMUX_APP_COMMIT"
          perl -0pi -e 's/proguard-android\.txt/proguard-android-optimize.txt/g' \
            ../termux-app/terminal-emulator/build.gradle \
            ../termux-app/terminal-view/build.gradle

      - name: Prepare Hiddify Core Android AAR
        run: |
          mkdir -p ../hiddify-core/bin /tmp/hiddify-core-android
          curl -L --fail --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/hiddify-lib-android.tar.gz \
            "https://github.com/hiddify/hiddify-core/releases/download/${HIDDIFY_CORE_VERSION}/hiddify-lib-android.tar.gz"
          echo "${HIDDIFY_CORE_ANDROID_SHA256}  /tmp/hiddify-lib-android.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hiddify-lib-android.tar.gz -C /tmp/hiddify-core-android
          cp "$(find /tmp/hiddify-core-android -name hiddify-core.aar -type f | head -1)" ../hiddify-core/bin/hiddify-core.aar
          test -s ../hiddify-core/bin/hiddify-core.aar

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
