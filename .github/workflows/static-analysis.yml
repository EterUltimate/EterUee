name: Static Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  TERMUX_APP_COMMIT: '30ebb2dee381d292ade0f2868cfde0f9f20b89fe'
  HIDDIFY_CORE_VERSION: 'v4.1.0'
  HIDDIFY_CORE_ANDROID_SHA256: '6c4841f7aab23eb1fb17831349ecdfc3ca9c31553b8cbe5effd820cb12607f56'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  codeql-javascript:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  codeql-android:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Termux Android modules
        run: |
          git clone https://github.com/termux/termux-app.git ../termux-app
          git -C ../termux-app checkout "$TERMUX_APP_COMMIT"
          perl -0pi -e 's/proguard-android\.txt/proguard-android-optimize.txt/g' \
            ../termux-app/terminal-emulator/build.gradle \
            ../termux-app/terminal-view/build.gradle

      - name: Prepare Hiddify Core Android AAR
        run: |
          mkdir -p ../hiddify-core/bin /tmp/hiddify-core-android
          curl -L --fail --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/hiddify-lib-android.tar.gz \
            "https://github.com/hiddify/hiddify-core/releases/download/${HIDDIFY_CORE_VERSION}/hiddify-lib-android.tar.gz"
          echo "${HIDDIFY_CORE_ANDROID_SHA256}  /tmp/hiddify-lib-android.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hiddify-lib-android.tar.gz -C /tmp/hiddify-core-android
          cp "$(find /tmp/hiddify-core-android -name hiddify-core.aar -type f | head -1)" ../hiddify-core/bin/hiddify-core.aar
          test -s ../hiddify-core/bin/hiddify-core.aar

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile Kotlin for CodeQL
        run: >
          ./gradlew clean :app:compileDebugKotlin :desktop:compileKotlin
          --no-daemon
          --no-build-cache
          --rerun-tasks
          --stacktrace
          -Dorg.gradle.caching=false
          -Dkotlin.compiler.execution.strategy=in-process
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif

  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
