name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Release Build & Sign
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare build files
        run: |
          # Decode base64-encoded keystore
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # Write signing config to local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # Write Google Services config (if needed)
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (AppBundle)
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign APK verification
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "✅ Signed APK found: $APK_PATH"
            $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK_PATH" || true
          else
            echo "⚠️ No signed APK found"
          fi

      - name: Extract version info
        id: version
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)
          if [ -n "$APK_PATH" ]; then
            VERSION_NAME=$($ANDROID_HOME/build-tools/*/aapt dump badging "$APK_PATH" | grep versionName | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            VERSION_CODE=$($ANDROID_HOME/build-tools/*/aapt dump badging "$APK_PATH" | grep versionCode | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
            echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
            echo "📦 Version: $VERSION_NAME ($VERSION_CODE)"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Generate changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "📋 Changes since $PREV_TAG:"
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges > CHANGELOG.md
          else
            echo "📋 Full changelog:"
            git log --pretty=format:"- %s (%h)" --no-merges -30 > CHANGELOG.md
          fi
          
          cat CHANGELOG.md
          echo "path=CHANGELOG.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: EterUee ${{ steps.version.outputs.name || github.ref_name }}
          body_path: ${{ steps.changelog.outputs.path || 'CHANGELOG.md' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
