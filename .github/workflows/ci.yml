name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.28.2'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  web-ui:
    name: WebUI Type, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install WebUI dependencies
        run: pnpm -C web-ui install --frozen-lockfile

      - name: Lint WebUI
        run: pnpm -C web-ui exec oxlint app --deny-warnings

      - name: Typecheck WebUI
        run: pnpm -C web-ui typecheck

      - name: Build WebUI
        run: pnpm -C web-ui build

  shared-kmp:
    name: Shared KMP Apple Framework
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build shared metadata and Android host tests
        run: ./gradlew :shared:metadataCommonMainClasses :shared:compileAndroidMain :shared:testAndroidHostTest --no-daemon --stacktrace

      - name: Build Apple XCFramework
        run: ./gradlew :shared:assembleEterUeeSharedDebugXCFramework --no-daemon --stacktrace

      - name: Prepare Swift package framework
        run: |
          rm -rf apple/Frameworks/EterUeeShared.xcframework
          mkdir -p apple/Frameworks
          cp -R shared/build/XCFrameworks/debug/EterUeeShared.xcframework apple/Frameworks/

      - name: Test Swift macOS host
        run: swift test --package-path apple

      - name: Build Swift iOS simulator host
        working-directory: apple
        run: |
          SCHEMES="$(xcodebuild -list | awk '/Schemes:/{p=1;next} p && NF {sub(/^[[:space:]]*/, ""); sub(/[[:space:]]*$/, ""); print}')"
          PACKAGE_SCHEME="$(printf '%s\n' "$SCHEMES" | grep -- '-Package$' | head -n 1 || true)"
          if [ -z "$PACKAGE_SCHEME" ]; then
            PACKAGE_SCHEME="$(printf '%s\n' "$SCHEMES" | head -n 1)"
          fi
          test -n "$PACKAGE_SCHEME"
          echo "Using Swift package scheme: $PACKAGE_SCHEME"
          xcodebuild \
            -scheme "$PACKAGE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath .build/xcode-derived \
            build

      - name: Upload Apple XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: EterUeeShared-debug-xcframework
          path: shared/build/XCFrameworks/debug/EterUeeShared.xcframework
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
