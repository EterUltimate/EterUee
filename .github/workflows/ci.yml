name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out Termux app modules
        uses: actions/checkout@v6
        with:
          repository: termux/termux-app
          path: termux-app

      - name: Patch Termux app modules for AGP 9
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path("termux-app").glob("*/build.gradle"):
              text = path.read_text()
              patched = text.replace(
                  "getDefaultProguardFile('proguard-android.txt')",
                  "getDefaultProguardFile('proguard-android-optimize.txt')",
              )
              if patched != text:
                  path.write_text(patched)
          PY

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '26'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun cache
        uses: actions/cache@v5
        with:
          path: web-ui/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out Termux app modules
        uses: actions/checkout@v6
        with:
          repository: termux/termux-app
          path: termux-app

      - name: Patch Termux app modules for AGP 9
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path("termux-app").glob("*/build.gradle"):
              text = path.read_text()
              patched = text.replace(
                  "getDefaultProguardFile('proguard-android.txt')",
                  "getDefaultProguardFile('proguard-android-optimize.txt')",
              )
              if patched != text:
                  path.write_text(patched)
          PY

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '26'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun cache
        uses: actions/cache@v5
        with:
          path: web-ui/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  build-debug:
    name: Debug Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Check out Termux app modules
        uses: actions/checkout@v6
        with:
          repository: termux/termux-app
          path: termux-app

      - name: Patch Termux app modules for AGP 9
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path("termux-app").glob("*/build.gradle"):
              text = path.read_text()
              patched = text.replace(
                  "getDefaultProguardFile('proguard-android.txt')",
                  "getDefaultProguardFile('proguard-android-optimize.txt')",
              )
              if patched != text:
                  path.write_text(patched)
          PY

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '26'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun cache
        uses: actions/cache@v5
        with:
          path: web-ui/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
