name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to publish, for example v5.2.4'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  android:
    name: Android Release Build & Sign
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare build files
        run: |
          # Decode base64-encoded keystore
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # Write signing config to local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo "storeFile=app.key" >> local.properties

          # Write Google Services config (if needed)
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (AppBundle)
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign APK verification
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)"
          if [ -n "$APK_PATH" ]; then
            echo "✅ Signed APK found: $APK_PATH"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
            "$APKSIGNER" verify --print-certs "$APK_PATH" || true
          else
            echo "⚠️ No signed APK found"
          fi

      - name: Extract version info
        id: version
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)"
          if [ -n "$APK_PATH" ]; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
            VERSION_NAME="$("$AAPT" dump badging "$APK_PATH" | grep versionName | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
            VERSION_CODE="$("$AAPT" dump badging "$APK_PATH" | grep versionCode | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
            echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
            echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
            echo "📦 Version: $VERSION_NAME ($VERSION_CODE)"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

  desktop-windows:
    name: Desktop Windows EXE
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and verify Windows desktop package
        run: .\gradlew.bat :desktop:desktopReleasePackage --no-daemon --stacktrace --console=plain

      - name: Prepare Windows desktop release files
        shell: pwsh
        run: |
          Copy-Item `
            -Path desktop/build/compose/binaries/main-release/desktop-release-manifest.txt `
            -Destination desktop/build/compose/binaries/main-release/desktop-release-manifest-windows.txt

      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-windows
          path: |
            desktop/build/compose/binaries/main-release/exe/*.exe
            desktop/build/compose/binaries/main-release/desktop-release-manifest-windows.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows packaging logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-windows-logs
          path: desktop/build/compose/logs/**
          if-no-files-found: ignore
          retention-days: 7

  desktop-linux:
    name: Desktop Linux DEB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and verify Linux desktop package
        run: ./gradlew :desktop:desktopReleasePackage --no-daemon --stacktrace --console=plain

      - name: Prepare Linux desktop release files
        run: |
          cp desktop/build/compose/binaries/main-release/desktop-release-manifest.txt \
            desktop/build/compose/binaries/main-release/desktop-release-manifest-linux.txt

      - name: Upload Linux desktop package
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-linux
          path: |
            desktop/build/compose/binaries/main-release/deb/*.deb
            desktop/build/compose/binaries/main-release/desktop-release-manifest-linux.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux packaging logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-linux-logs
          path: desktop/build/compose/logs/**
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - desktop-windows
      - desktop-linux
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")"
          
          if [ -n "$PREV_TAG" ]; then
            echo "📋 Changes since $PREV_TAG:"
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges > CHANGELOG.md
          else
            echo "📋 Full changelog:"
            git log --pretty=format:"- %s (%h)" --no-merges -30 > CHANGELOG.md
          fi
          
          cat CHANGELOG.md
          echo "path=CHANGELOG.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: EterUee ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.changelog.outputs.path }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-alpha') }}
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/desktop-release-manifest-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
